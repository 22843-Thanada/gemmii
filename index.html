<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#01020b">
<title>Aimaam Galaxy Portfolio</title>

<style>
:root{
--bg:#01020b;
--bg2:#08051c;
--cyan:#00f6ff;
--blue:#398cff;
--purple:#9147ff;
--pink:#ff3cac;
--yellow:#ffe45c;
--green:#55ffb0;
--orange:#ff8c00;
--white:#fff;
--soft:#d9e0ff;
--muted:#8995bd;
--panel:rgba(9,14,40,.82);
--border:rgba(0,246,255,.3);
--max:1200px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
overflow-x:hidden;
color:#fff;
font-family:"Noto Sans Thai","Segoe UI",Arial,sans-serif;
background:
radial-gradient(circle at 20% 10%,rgba(0,246,255,.18),transparent 25%),
radial-gradient(circle at 80% 20%,rgba(145,71,255,.24),transparent 30%),
radial-gradient(circle at 50% 75%,rgba(255,60,172,.13),transparent 30%),
radial-gradient(circle at 50% 50%,#101650 0%,#05051a 40%,#01020b 100%);
background-attachment:fixed;
}

/* =========================================================
   SPACE BACKGROUND
========================================================= */

body:before{
content:"";
position:fixed;
inset:0;
z-index:-100;
pointer-events:none;
background-image:
radial-gradient(#fff 1px,transparent 1.5px),
radial-gradient(#00f6ff 1px,transparent 1.5px),
radial-gradient(#9147ff 1px,transparent 1.7px),
radial-gradient(#ff3cac 1px,transparent 1.6px);
background-size:
65px 65px,
130px 130px,
210px 210px,
310px 310px;
opacity:.55;
animation:deepStars 45s linear infinite;
}

@keyframes deepStars{
to{
background-position:
600px 900px,
-500px 700px,
700px -500px,
-800px 300px;
}
}

/* =========================================================
   NEBULA
========================================================= */

.nebula{
position:fixed;
pointer-events:none;
border-radius:50%;
filter:blur(55px);
z-index:-90;
}

.nebula.one{
width:650px;
height:650px;
left:-250px;
top:5%;
background:radial-gradient(
circle,
rgba(0,246,255,.2),
rgba(0,100,255,.08),
transparent 70%
);
animation:nebulaOne 15s ease-in-out infinite alternate;
}

.nebula.two{
width:800px;
height:800px;
right:-350px;
top:20%;
background:radial-gradient(
circle,
rgba(145,71,255,.22),
rgba(255,60,172,.08),
transparent 70%
);
animation:nebulaTwo 18s ease-in-out infinite alternate;
}

.nebula.three{
width:700px;
height:700px;
left:35%;
bottom:-350px;
background:radial-gradient(
circle,
rgba(255,60,172,.16),
rgba(0,246,255,.08),
transparent 70%
);
animation:nebulaThree 20s ease-in-out infinite alternate;
}

@keyframes nebulaOne{
to{
transform:translate(180px,100px) scale(1.25) rotate(30deg);
}
}

@keyframes nebulaTwo{
to{
transform:translate(-150px,120px) scale(1.3) rotate(-25deg);
}
}

@keyframes nebulaThree{
to{
transform:translate(80px,-150px) scale(1.2);
}
}

/* =========================================================
   GALAXY RING
========================================================= */

.galaxyRing{
position:fixed;
width:850px;
height:280px;
left:50%;
top:48%;
transform:translate(-50%,-50%) rotate(-18deg);
border-radius:50%;
border:2px solid rgba(0,246,255,.08);
box-shadow:
0 0 60px rgba(0,246,255,.08),
inset 0 0 60px rgba(145,71,255,.06);
z-index:-80;
pointer-events:none;
animation:galaxySpin 35s linear infinite;
}

.galaxyRing:before,
.galaxyRing:after{
content:"";
position:absolute;
inset:-45px;
border-radius:50%;
border:1px solid rgba(145,71,255,.08);
}

.galaxyRing:after{
inset:45px;
border-color:rgba(255,60,172,.08);
}

@keyframes galaxySpin{
to{
transform:translate(-50%,-50%) rotate(342deg);
}
}

/* =========================================================
   MOUSE GLOW
========================================================= */

#mouseGlow{
position:fixed;
width:350px;
height:350px;
border-radius:50%;
pointer-events:none;
z-index:9998;
transform:translate(-50%,-50%);
background:
radial-gradient(
circle,
rgba(0,246,255,.17),
rgba(145,71,255,.09),
transparent 68%
);
mix-blend-mode:screen;
transition:opacity:.2s;
}

/* =========================================================
   MOUSE STAR TRAIL
========================================================= */

.mouseStar{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
pointer-events:none;
z-index:9997;
background:var(--cyan);
box-shadow:
0 0 6px currentColor,
0 0 14px currentColor,
0 0 25px currentColor;
animation:mouseStarFly .9s ease-out forwards;
}

@keyframes mouseStarFly{
0%{
opacity:1;
transform:scale(1) translate(0,0);
}
100%{
opacity:0;
transform:
scale(.15)
translate(
var(--mx),
var(--my)
);
}
}

/* =========================================================
   CLICK STAR BURST
========================================================= */

.clickStar{
position:fixed;
width:8px;
height:8px;
border-radius:50%;
pointer-events:none;
z-index:99999;
background:var(--starColor);
box-shadow:
0 0 8px var(--starColor),
0 0 18px var(--starColor),
0 0 35px var(--starColor);
animation:clickBurst 1.2s cubic-bezier(.15,.8,.2,1) forwards;
}

@keyframes clickBurst{
0%{
opacity:1;
transform:translate(-50%,-50%) scale(.2);
}
100%{
opacity:0;
transform:
translate(
calc(-50% + var(--cx)),
calc(-50% + var(--cy))
)
scale(.05);
}
}

/* =========================================================
   FLOATING STARS
========================================================= */

.stars{
position:fixed;
inset:0;
pointer-events:none;
z-index:2;
}

.star{
position:absolute;
animation:starFloat 4s ease-in-out infinite;
}

.s1{left:4%;top:15%;font-size:26px}
.s2{right:5%;top:26%;font-size:35px;animation-delay:1s}
.s3{left:8%;top:52%;font-size:23px;animation-delay:2s}
.s4{right:9%;top:72%;font-size:30px;animation-delay:.6s}
.s5{left:18%;top:86%;font-size:21px;animation-delay:1.7s}
.s6{left:42%;top:18%;font-size:18px;animation-delay:.4s}
.s7{right:30%;top:80%;font-size:25px;animation-delay:1.2s}

@keyframes starFloat{
0%,100%{
transform:translateY(0) rotate(0);
opacity:.4;
}
50%{
transform:translateY(-25px) rotate(15deg);
opacity:1;
filter:
drop-shadow(0 0 8px white)
drop-shadow(0 0 18px var(--cyan));
}
}

/* =========================================================
   PLANETS BACKGROUND
========================================================= */

.spacePlanet,
.saturn{
position:fixed;
border-radius:50%;
pointer-events:none;
z-index:1;
}

.spacePlanet{
animation:planetFloat 8s ease-in-out infinite;
}

.planetBlue{
width:75px;
height:75px;
top:20%;
left:-20px;
background:
radial-gradient(
circle at 30% 25%,
#fff,
#56eaff 15%,
#267aff 45%,
#16206e 75%,
#050512
);
box-shadow:
0 0 20px var(--cyan),
0 0 50px rgba(0,246,255,.4);
}

.planetPurple{
width:55px;
height:55px;
right:7%;
top:43%;
background:
radial-gradient(
circle at 30% 25%,
#ffd9ff,
#b967ff 30%,
#6425c9 65%,
#15062d
);
box-shadow:0 0 25px var(--purple);
}

.planetYellow{
width:42px;
height:42px;
left:11%;
bottom:18%;
background:
radial-gradient(
circle at 30% 25%,
#fff,
#ffe45c 30%,
#ff9d00 70%,
#501600
);
box-shadow:0 0 20px var(--yellow);
}

/* เพิ่มดาวเคราะห์ */

.planetGreen{
width:62px;
height:62px;
left:4%;
top:72%;
background:
radial-gradient(
circle at 30% 25%,
#eaffff,
#55ffb0 20%,
#16a879 55%,
#03291f
);
box-shadow:
0 0 20px var(--green),
0 0 45px rgba(85,255,176,.3);
animation-delay:1s;
}

.planetRed{
width:48px;
height:48px;
right:17%;
top:13%;
background:
radial-gradient(
circle at 30% 25%,
#fff,
#ff8c8c 18%,
#ff3c3c 48%,
#5a0808 80%
);
box-shadow:
0 0 20px #ff3c3c,
0 0 45px rgba(255,60,60,.3);
animation-delay:2s;
}

.planetTiny{
width:28px;
height:28px;
right:32%;
bottom:12%;
background:
radial-gradient(
circle at 30% 25%,
#fff,
#ffe45c,
#ff8c00,
#321000
);
box-shadow:0 0 20px var(--yellow);
animation-delay:3s;
}

.planetCyan{
width:38px;
height:38px;
left:31%;
top:7%;
background:
radial-gradient(
circle at 30% 25%,
#fff,
#00f6ff 25%,
#0066ff 65%,
#06102e
);
box-shadow:0 0 25px var(--cyan);
animation-delay:1.5s;
}

@keyframes planetFloat{
0%,100%{
transform:translateY(0) rotate(0);
}
50%{
transform:translateY(-35px) rotate(180deg);
}
}

/* =========================================================
   SATURN
========================================================= */

.saturn{
right:2%;
bottom:8%;
width:100px;
height:100px;
background:
radial-gradient(
circle at 30% 25%,
#fff5c4,
#e4b55b 25%,
#a96b32 60%,
#29130c
);
box-shadow:
0 0 25px rgba(255,200,100,.5);
animation:
saturnFloat 7s ease-in-out infinite,
saturnColor 8s ease-in-out infinite;
}

.saturn:before{
content:"";
position:absolute;
width:165px;
height:45px;
left:-33px;
top:28px;
border:6px solid rgba(255,220,130,.55);
border-radius:50%;
transform:rotate(-15deg);
box-shadow:0 0 15px rgba(255,220,130,.4);
animation:ringColor 8s ease-in-out infinite;
}

.saturn:after{
content:"";
position:absolute;
width:34px;
height:34px;
right:-55px;
top:0;
border-radius:50%;
background:
radial-gradient(
circle at 30% 25%,
#fff,
#61eaff 25%,
#398cff 60%,
#11164b
);
box-shadow:
0 0 12px var(--cyan),
0 0 25px rgba(0,246,255,.5);
animation:moonFloat 5s ease-in-out infinite;
}

@keyframes saturnFloat{
50%{
transform:translateY(-25px) rotate(8deg);
}
}

@keyframes saturnColor{
0%{
filter:hue-rotate(0deg);
}
25%{
filter:hue-rotate(70deg);
}
50%{
filter:hue-rotate(150deg);
}
75%{
filter:hue-rotate(250deg);
}
100%{
filter:hue-rotate(360deg);
}
}

@keyframes ringColor{
0%{border-color:rgba(255,220,130,.6)}
25%{border-color:rgba(0,246,255,.7)}
50%{border-color:rgba(145,71,255,.7)}
75%{border-color:rgba(255,60,172,.7)}
100%{border-color:rgba(255,220,130,.6)}
}

@keyframes moonFloat{
50%{
transform:translateY(-18px) translateX(8px);
}
}

/* =========================================================
   UFO
========================================================= */

.ufo{
position:fixed;
right:-140px;
top:18%;
font-size:65px;
z-index:8;
pointer-events:none;
animation:ufoFly 14s linear infinite;
filter:
drop-shadow(0 0 8px white)
drop-shadow(0 0 15px var(--cyan))
drop-shadow(0 0 35px var(--purple));
}

.ufo:after{
content:"";
position:absolute;
width:80px;
height:35px;
left:18px;
top:55px;
background:
linear-gradient(
to bottom,
rgba(0,246,255,.7),
transparent
);
filter:blur(8px);
transform:
perspective(100px)
rotateX(55deg);
}

@keyframes ufoFly{
0%{
transform:translate(0,0) rotate(-5deg);
}
25%{
transform:translate(-25vw,90px) rotate(8deg);
}
50%{
transform:translate(-55vw,-70px) rotate(-8deg);
}
75%{
transform:translate(-85vw,100px) rotate(5deg);
}
100%{
transform:translate(-125vw,-50px) rotate(-5deg);
}
}

/* =========================================================
   SPACE CAT
========================================================= */

.spaceCat{
position:fixed;
right:-130px;
top:58%;
font-size:70px;
z-index:7;
pointer-events:none;
filter:
drop-shadow(0 0 8px white)
drop-shadow(0 0 20px var(--cyan))
drop-shadow(0 0 35px var(--purple));
animation:catFly 19s linear infinite;
}

@keyframes catFly{
0%{
transform:translate(0,0) rotate(-5deg);
}
25%{
transform:translate(-25vw,-70px) rotate(8deg);
}
50%{
transform:translate(-55vw,40px) rotate(-5deg);
}
75%{
transform:translate(-85vw,-80px) rotate(8deg);
}
100%{
transform:translate(-125vw,20px) rotate(-5deg);
}
}

/* =========================================================
   ROCKETS
========================================================= */

.rocket{
position:fixed;
z-index:10;
pointer-events:none;
font-size:58px;
filter:
drop-shadow(0 0 5px white)
drop-shadow(0 0 15px var(--cyan))
drop-shadow(0 0 30px var(--pink));
}

.rocket:after{
content:"";
position:absolute;
width:22px;
height:65px;
left:19px;
bottom:-48px;
border-radius:50% 50% 65% 65%;
background:
linear-gradient(
to bottom,
#fff,
#ffe45c 20%,
#ff8c00 50%,
#ff2b00 75%,
transparent
);
filter:
blur(3px)
drop-shadow(0 0 8px #ffe45c)
drop-shadow(0 0 18px #ff5a00);
animation:engineFire .12s ease-in-out infinite alternate;
}

.rocket:before{
content:"";
position:absolute;
width:55px;
height:55px;
left:3px;
bottom:-40px;
border-radius:50%;
background:
radial-gradient(
circle,
rgba(255,228,92,.8),
rgba(255,60,0,.3),
transparent 70%
);
filter:blur(8px);
animation:engineGlow .18s ease-in-out infinite alternate;
}

@keyframes engineFire{
from{
height:45px;
opacity:.7;
}
to{
height:75px;
opacity:1;
}
}

@keyframes engineGlow{
from{
transform:scale(.8);
}
to{
transform:scale(1.25);
}
}

.rocket1{
left:-120px;
top:30%;
animation:rocketFly1 11s linear infinite;
}

.rocket2{
right:-120px;
top:70%;
font-size:48px;
animation:rocketFly2 14s linear infinite;
}

.rocket3{
left:20%;
bottom:-100px;
font-size:42px;
animation:rocketFly3 10s linear infinite;
}

@keyframes rocketFly1{
0%{
transform:translate(0,0) rotate(25deg);
}
50%{
transform:translate(55vw,-150px) rotate(25deg);
}
100%{
transform:translate(120vw,-300px) rotate(25deg);
}
}

@keyframes rocketFly2{
0%{
transform:translate(0,0) rotate(-25deg);
}
50%{
transform:translate(-55vw,-100px) rotate(-25deg);
}
100%{
transform:translate(-125vw,-200px) rotate(-25deg);
}
}

@keyframes rocketFly3{
0%{
transform:translateY(0) rotate(-20deg);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh) rotate(-20deg);
opacity:0;
}
}

.rocket4{
position:fixed;
right:-100px;
top:8%;
font-size:38px;
z-index:9;
pointer-events:none;
animation:rocket4Fly 18s linear infinite;
filter:
drop-shadow(0 0 8px white)
drop-shadow(0 0 20px var(--cyan));
}

.rocket4:after{
content:"";
position:absolute;
width:15px;
height:55px;
left:12px;
bottom:-40px;
background:
linear-gradient(
to bottom,
white,
#ffe45c,
#ff3c00,
transparent
);
border-radius:50%;
filter:blur(3px);
}

@keyframes rocket4Fly{
0%{
transform:translate(0,0) rotate(-30deg);
}
100%{
transform:translate(-125vw,55vh) rotate(-30deg);
}
}

/* =========================================================
   SHOOTING STAR
========================================================= */

.shootingStar{
position:fixed;
width:180px;
height:4px;
border-radius:50%;
background:
linear-gradient(
90deg,
transparent,
white 35%,
var(--cyan)
);
box-shadow:
0 0 8px white,
0 0 18px var(--cyan),
0 0 35px var(--purple);
z-index:100;
pointer-events:none;
transform:rotate(-35deg);
animation:shooting 1.15s linear forwards;
}

.shootingStar.pink{
background:
linear-gradient(
90deg,
transparent,
white 35%,
var(--pink)
);
box-shadow:
0 0 8px white,
0 0 18px var(--pink),
0 0 35px var(--purple);
}

@keyframes shooting{
0%{
opacity:0;
transform:
translate(0,0)
rotate(-35deg)
scale(.6);
}
10%{
opacity:1;
}
100%{
opacity:0;
transform:
translate(-500px,400px)
rotate(-35deg)
scale(1.2);
}
}

/* =========================================================
   F5 METEOR SHOWER
========================================================= */

.f5Meteor{
position:fixed;
width:4px;
height:120px;
border-radius:50%;
pointer-events:none;
z-index:99990;
background:
linear-gradient(
to bottom,
white,
var(--meteorColor),
transparent
);
box-shadow:
0 0 8px white,
0 0 18px var(--meteorColor),
0 0 35px var(--meteorColor);
transform:rotate(-35deg);
animation:f5MeteorFall var(--fallTime) linear forwards;
}

@keyframes f5MeteorFall{
0%{
opacity:0;
transform:
translate(0,0)
rotate(-35deg)
scale(.4);
}
10%{
opacity:1;
}
100%{
opacity:0;
transform:
translate(var(--fallX),var(--fallY))
rotate(-35deg)
scale(1.2);
}
}

/* =========================================================
   LOADER
========================================================= */

#loader{
position:fixed;
inset:0;
z-index:999999;
display:grid;
place-items:center;
background:
radial-gradient(
circle at center,
#11174b 0%,
#05051a 45%,
#01020b 100%
);
transition:
opacity .45s ease,
visibility .45s ease;
}

#loader.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

.loaderBox{
width:min(90%,420px);
text-align:center;
}

.loaderPlanet{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:
radial-gradient(
circle at 30% 25%,
#fff 0%,
#55eaff 18%,
#6540ef 58%,
#09021d 100%
);
box-shadow:
0 0 25px var(--cyan),
0 0 60px var(--purple);
animation:loaderSpin 1.2s linear infinite;
}

@keyframes loaderSpin{
to{
transform:rotate(360deg);
}
}

.loaderTitle{
margin-top:18px;
font-size:clamp(1.8rem,7vw,3.2rem);
font-weight:950;
}

.loaderText{
margin-top:8px;
color:var(--cyan);
font-weight:800;
}

.loaderBar{
width:min(270px,80vw);
height:5px;
margin:18px auto 0;
overflow:hidden;
border-radius:999px;
background:rgba(255,255,255,.1);
}

.loaderBar i{
display:block;
width:0;
height:100%;
border-radius:999px;
background:
linear-gradient(
90deg,
var(--cyan),
var(--purple),
var(--pink)
);
animation:loadFast .7s ease-out forwards;
}

@keyframes loadFast{
to{
width:100%;
}
}

/* =========================================================
   HEADER
========================================================= */

header{
position:sticky;
top:0;
z-index:500;
background:rgba(2,3,13,.75);
border-bottom:1px solid var(--border);
backdrop-filter:blur(20px);
}

nav{
min-height:72px;
display:flex;
align-items:center;
justify-content:space-between;
}

.container{
width:min(calc(100% - 32px),var(--max));
margin:auto;
}

.logo{
border:0;
background:none;
color:#fff;
font-weight:950;
font-size:1.3rem;
cursor:pointer;
text-shadow:0 0 15px var(--cyan);
}

.logo b{
color:var(--cyan);
}

.nav{
display:flex;
gap:4px;
list-style:none;
}

.nav button,
.mobileBtn{
border:0;
background:transparent;
color:var(--soft);
cursor:pointer;
padding:10px 12px;
border-radius:12px;
font-weight:850;
transition:.25s;
}

.nav button:hover,
.nav button.active{
color:var(--cyan);
background:rgba(0,246,255,.08);
box-shadow:0 0 20px rgba(0,246,255,.15);
}

.mobileBtn{
display:none;
font-size:1.6rem;
}

.mobileMenu{
display:none;
padding:8px 0 14px;
}

.mobileMenu.open{
display:block;
}

.mobileMenu button{
width:100%;
text-align:left;
border:1px solid var(--border);
background:rgba(255,255,255,.04);
color:#fff;
padding:13px;
border-radius:12px;
margin-top:6px;
}

/* =========================================================
   PAGE
========================================================= */

main{
position:relative;
z-index:20;
}

.page{
display:none;
min-height:calc(100vh - 72px);
padding:80px 0 100px;
animation:pageIn .5s ease;
}

.page.active{
display:block;
}

@keyframes pageIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:none;
}
}

/* =========================================================
   HERO
========================================================= */

.hero{
min-height:calc(100vh - 72px);
display:grid;
grid-template-columns:1.05fr .95fr;
gap:55px;
align-items:center;
}

.eyebrow{
display:inline-block;
padding:8px 16px;
border:1px solid var(--cyan);
border-radius:999px;
color:var(--cyan);
background:rgba(0,246,255,.07);
